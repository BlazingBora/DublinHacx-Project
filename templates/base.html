<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XpireScan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="bg-fx" aria-hidden="true">
        <span class="bg-blob bg-blob-1"></span>
        <span class="bg-blob bg-blob-2"></span>
        <span class="bg-blob bg-blob-3"></span>
        <span class="bg-grid"></span>
    </div>
    <main class="page">
        <div class="top-row">
            <div>
                <h1>⏳ XpireScan</h1>
                <p class="subtitle">Scan a receipt, snap a medication label, or just type what you bought, then track expiration dates and turn soon-to-expire groceries into a recipe.</p>
            </div>
            <a href="{{ url_for('inventory') }}" class="nav-link">📋 My Inventory</a>
        </div>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
