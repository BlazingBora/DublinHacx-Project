# Fly.io app config for XpireScan.
# Created by `fly launch` normally - written by hand here since flyctl
# isn't installed in this environment. Review app name / region before
# first deploy; `fly launch` will also offer to generate/adjust this.

app = "xpirescan"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/"

[mounts]
  source = "xpirescan_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
